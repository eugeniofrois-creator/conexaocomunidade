<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conexão Comunidade — configuração individual</title><style>body{font:16px system-ui;color:#183d33;background:#f3f7f5;margin:0;padding:2rem}main{max-width:580px;margin:auto;background:white;padding:2rem;border-radius:18px}label{display:block;margin-top:1rem;font-weight:600}input{box-sizing:border-box;width:100%;padding:.75rem;margin-top:.35rem;border:1px solid #aabbb4;border-radius:8px}button{padding:.7rem 1rem;margin:1rem .5rem 0 0;border:0;border-radius:8px;background:#126654;color:white;cursor:pointer}small{color:#50645c}#status{min-height:1.5rem}</style></head><body><main><h1>Configuração do repositório</h1><p>Esta configuração fica neste navegador e aponta para um único repositório.</p><form id="config"><label>Conta do GitHub<input name="owner" required pattern="[A-Za-z0-9_.-]+"></label><label>Repositório<input name="repo" required pattern="[A-Za-z0-9_.-]+"></label><label>Branch<input name="branch" value="main" required></label><label>Token de acesso<input name="token" type="password" required autocomplete="off"></label><label>Senha para criptografia dos JSONs<input name="password" type="password" required autocomplete="new-password"></label><button type="submit">Verificar e salvar</button><button id="remove" type="button">Remover configuração</button></form><p id="status" role="status"></p><small>O token é salvo cifrado neste navegador. Você precisará da senha para utilizá-lo; cada navegador precisa da própria configuração.</small></main><script type="module" src="setup-individual.js"></script></body></html>
