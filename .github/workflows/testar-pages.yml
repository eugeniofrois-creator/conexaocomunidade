name: Testes do GitHub Pages
on:
  push:
    branches: [codex/pages-essential-tests]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  pages:
    name: Pages (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright-core install --with-deps ${{ matrix.browser }}
      - name: Verificar Pages sem credenciais reais
        env:
          PAGES_BROWSERS: ${{ matrix.browser }}
        run: pnpm run test:pages
