name: Exportar imagem para migração
on:
  push:
    branches: [integracao-github-individual]
    paths: [.github/workflows/exportar-imagem.yml]
permissions:
  contents: read
jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar imagem pública
        run: |
          mkdir -p exportacao
          curl --fail --silent --show-error --max-time 60 'https://conexao-comunidade-frei-damiao.eugenio-frois.chatgpt.site/api/company-image?id=bf5596c4-8200-4ec2-bbbc-6021a064f444' -o exportacao/imagem
      - uses: actions/upload-artifact@v4
        with:
          name: imagem-migracao
          path: exportacao/imagem
          retention-days: 1
