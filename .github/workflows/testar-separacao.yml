name: Verificar separação de origens
on:
  push:
    branches: [integracao-github-individual]
    paths: [.github/workflows/testar-separacao.yml]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir origens
        run: |
          url='https://conexao-comunidade-frei-damiao.eugenio-frois.chatgpt.site/api/pages-bridge?endpoint=companies'
          ilab=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 -X OPTIONS -H 'Origin: https://ilabfmp.github.io' -H 'Access-Control-Request-Method: GET' "$url")
          proprio=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 -X OPTIONS -H 'Origin: https://eugeniofrois-creator.github.io' -H 'Access-Control-Request-Method: GET' "$url")
          test "$ilab" = 403
          test "$proprio" = 204
          echo 'OK: origem do ILAB bloqueada; origem própria mantida durante migração.'
